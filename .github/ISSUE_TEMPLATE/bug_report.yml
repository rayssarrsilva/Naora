name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Screen or flow
      placeholder: Booking · pick a time
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Press Tab ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (blocks usage)
        - High (major feature broken)
        - Medium (workaround exists)
        - Low (cosmetic)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Chrome 140, macOS, light theme, NVDA
