version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # One pull request for small updates; majors come one by one, to be read and tested.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1. Lift this when it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types must match the Node.js that runs the app (.nvmrc).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore(docker)
    ignore:
      # Stay on the Node.js LTS line that .nvmrc and CI use; move both together.
      - dependency-name: node
        update-types: [version-update:semver-major]
