name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the code unless a job asks for more.
permissions:
  contents: read

env:
  # GitHub's runners sometimes drop a download mid-way (ECONNRESET). Retry instead of failing.
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_mintimeout: 20000
  npm_config_fetch_retry_maxtimeout: 120000
  # Only the E2E job needs the Cypress binary.
  CYPRESS_INSTALL_BINARY: 0
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx tsc -p cypress
      - run: npm test -- --coverage

  database:
    name: Migrations apply and match the schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: naora
          POSTGRES_PASSWORD: naora
          POSTGRES_DB: naora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U naora -d naora" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://naora:naora@localhost:5432/naora
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Apply every migration to an empty database
        run: npm run db:deploy
      - name: Fail if schema.prisma changed without a migration
        run: npm run db:check
      - name: Integration tests (repositories against real Postgres, tenant isolation)
        run: npm run test:integration

  e2e:
    name: Build, E2E (Cypress) and API tests (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: naora
          POSTGRES_PASSWORD: naora
          POSTGRES_DB: naora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U naora -d naora" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      CYPRESS_INSTALL_BINARY: ''
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://naora:naora@localhost:5432/naora
      # Test-only secret; production sets its own.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run db:deploy
      - name: Start the production server (standalone output, as in Docker)
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          npx wait-on --timeout 60000 http://127.0.0.1:3000/api/health
      - name: Cypress
        run: npx cypress run --browser chrome
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:3000
      - name: Newman (Postman collection)
        run: npm run test:api
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: Show the end of the server log when something fails
        if: failure()
        run: tail -n 80 server.log
      - name: Keep screenshots and the server log when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            cypress/screenshots
            server.log
          retention-days: 7

  docker:
    name: Docker image builds and passes its health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start Postgres, migrations and the app
        run: docker compose up --build --detach --wait app
      - name: The app reaches the database
        run: |
          curl --fail --silent http://localhost:3000/api/health | tee health.json
          grep -q '"database":"ok"' health.json
      - name: The container does not run as root
        run: test "$(docker compose exec -T app id -u)" != "0"
      - if: always()
        run: docker compose logs --no-color > compose.log && docker compose down -v
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-failure
          path: compose.log
          retention-days: 7
